site_name: cachetrace
site_description: Prefix-Cache Efficiency Auditor
repo_url: https://github.com/jahnavi-yelamanchi/cachetrace
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Providers: providers.md
  - Cost model: cost-model.md
  - Benchmark: benchmark.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
