[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachetrace"
version = "0.1.0"
description = "Prefix-Cache Efficiency Auditor — find and fix what busts your LLM prefix cache"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "cachetrace contributors" }]
keywords = [
    "llm", "prefix-cache", "vllm", "sglang", "inference", "tokenizer",
    "radix-tree", "cost-optimization", "kv-cache", "prompt-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.6"]
hf = ["transformers>=4.40", "tokenizers>=0.19"]
proxy = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
bench = ["httpx>=0.27"]
all = [
    "tiktoken>=0.6",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "tiktoken>=0.6",
]

[project.scripts]
cachetrace = "cachetrace.cli.main:app"

[project.urls]
Homepage = "https://github.com/jahnavi-yelamanchi/cachetrace"
Repository = "https://github.com/jahnavi-yelamanchi/cachetrace"
Issues = "https://github.com/jahnavi-yelamanchi/cachetrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cachetrace"]

[tool.hatch.build.targets.wheel.force-include]
"src/cachetrace/examples" = "cachetrace/examples"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer's Option/Argument-in-defaults is the documented, idiomatic pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
